# Serves the static frontend and proxies API routes to FastAPI on the same
# origin, so the browser never makes a cross-origin request.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve "web" through Docker's DNS so a recreated API container
    # (new IP) doesn't leave nginx pointing at a stale address.
    resolver 127.0.0.11 valid=10s;
    set $api http://web:8000;

    location ~ ^/(auth|tasks|users|roles)(/|$) {
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
