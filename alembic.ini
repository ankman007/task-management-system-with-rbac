# Alembic configuration.
#
# The database URL is deliberately NOT set here: alembic/env.py reads it from
# app.core.config.settings (DATABASE_URL), so migrations always target the
# same database as the application.

[alembic]
script_location = %(here)s/alembic

# e.g. alembic/versions/2026_10_17_1530-0003_add_task_priority.py
# Pass --rev-id to keep the short sequential ids used by existing revisions.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
truncate_slug_length = 40

# Make the project root importable so env.py can `import app`.
prepend_sys_path = .
path_separator = os


[post_write_hooks]
# Format newly generated revisions with ruff (installed via requirements-dev.txt).
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
