# Host ports are configurable via .env (defaults avoid the common 5432/6379/8000)
services:
  db:
    image: postgres:17-alpine
    container_name: task_manager_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_HOST_PORT:-15432}:5432"
    volumes:
      - pg17_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: task_manager_redis
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    image: task_manager_app
    container_name: task_manager_api
    env_file: .env
    environment:
      RUN_MIGRATIONS: "1"
    ports:
      - "${API_HOST_PORT:-18000}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/code/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    image: task_manager_app
    container_name: task_manager_worker
    env_file: .env
    command: celery -A app.core.celery_app worker --loglevel=info
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  pg17_data:
