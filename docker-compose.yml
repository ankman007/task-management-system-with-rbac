# Local stack: PostgreSQL, the FastAPI app and the static frontend.
#
#   docker compose up -d --build                    # db + api + frontend
#   docker compose --profile test run --rm test     # run the test suite
#
# Values come from .env (copy .env.example). Host ports are configurable so
# they don't clash with other local services; container ports are fixed.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-task_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-task_db}
    ports:
      - "${DB_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    image: task-management-api:latest
    env_file: .env
    environment:
      # Overrides the localhost URL in .env: inside the network the host is "db".
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-task_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-task_db}
      RUN_MIGRATIONS: "1"
    ports:
      - "${API_HOST_PORT:-18000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "${FRONTEND_HOST_PORT:-18080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  # Test runner, only started on demand. It uses a separate database on the
  # same server (the test suite creates it if missing), never the dev data.
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    image: task-management-api:test
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-task_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-task_db}_test
      SECRET_KEY: test-secret-key-that-is-long-enough
      ENVIRONMENT: test
    depends_on:
      db:
        condition: service_healthy

volumes:
  # Not the old "pg17_data" name: that volume holds the previous sync schema
  # and alembic revisions that no longer exist.
  postgres_data:
