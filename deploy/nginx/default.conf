# Single-origin front door: the static dashboard at /, the FastAPI app at /api.
#
#   /                -> frontend files baked into this image
#   /api/...         -> api:8000 (the app runs with ROOT_PATH=/api)
#   /docs, /redoc,
#   /openapi.json    -> api:8000 (Swagger UI and the OpenAPI document)
#   /nginx-health    -> this container's own healthcheck
#
# Plain HTTP on port 80. TLS ends in front of this container: on Dokploy that
# is Traefik (and Cloudflare in front of it). See docs/DEPLOYMENT.md.

# Docker's embedded DNS. Re-resolving "api" means a recreated api container
# (new IP) is picked up without restarting nginx, and nginx can start first.
resolver 127.0.0.11 valid=10s ipv6=off;

# Keep the scheme the TLS terminator saw; fall back to our own when the
# request came straight in (local development).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Behind Cloudflare every request reaches us from a handful of proxy IPs, so
# rate-limit by the visitor IP Cloudflare reports. A client bypassing
# Cloudflare could forge the header, but that only lets it pick its own bucket.
map $http_cf_connecting_ip $client_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# Brute-force protection for login/registration: 10 requests per minute per
# client, with a burst of 10.
limit_req_zone $client_key zone=auth:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    # The API only accepts small JSON/form bodies.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    set $api http://api:8000;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass $api;
        include /etc/nginx/snippets/proxy_params.inc;
    }

    location /api/ {
        proxy_pass $api;
        include /etc/nginx/snippets/proxy_params.inc;
    }

    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        proxy_pass $api;
        include /etc/nginx/snippets/proxy_params.inc;
    }

    location / {
        include /etc/nginx/snippets/security_headers.inc;
        # Strict policy for the dashboard; it loads Lucide from unpkg and the
        # Inter font from Google Fonts, and uses inline style attributes.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Rate-limited requests get the API's error envelope.
    error_page 429 @rate_limited;
    location @rate_limited {
        include /etc/nginx/snippets/security_headers.inc;
        default_type application/json;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests; try again in a minute","details":null}}';
    }
}
